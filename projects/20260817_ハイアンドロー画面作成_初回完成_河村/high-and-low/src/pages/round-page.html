<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="../css/style.css">
    <title>ラウンド結果 - High and Low</title>
</head>
<body class="bg-image">
    <div class="page">
        <!-- Header -->
        <header class="page-header">
            <h1 class="font-system">Win</h1>
        </header>

        <!-- <header class="page-header">
            <h1 class="font-system text-red">Lose</h1>
        </header> -->

        <!-- <header class="page-header">
            <h1 class="font-system text-pale">Draw</h1>
        </header> -->
    
        <main class="round-page">
            <section class="round-section">

                <!-- Round Card -->
                <div class="round-card-container">
                    <div class="card-grid">
                        <figure class="card">
                            <img src="../images/club/club1.png" alt="">
                            <figcaption>親カード</figcaption>
                        </figure>
                        <figure class="card">
                            <img src="../images/club/club2.png" alt="">
                            <figcaption>あなたのカード</figcaption>
                        </figure>
                    </div>
                </div>

                <div class="text-wrapper">
                    <p class="text-center">
                        あなたが選択したのは <span>[High]</span> でした
                    </p>
                </div>

                <!-- Button -->
                <div class="button-wrapper">
                    <a class="btn btn--result" href="./result-page.html">結果画面へ</a>
                    <a class="btn btn--continue" href="./game-page.html">続ける</a>
                </div>
            </section>
        </main>
    </div>  
</body>
</html>
