<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="./css/typography.css">
    <link rel="stylesheet" href="./css/utils.css">
    <link rel="stylesheet" href="./css/components/buttons.css">
    <link rel="stylesheet" href="./css/card.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>Guide - High and Low</title>
</head>
<body class="dotgothic16">
    
    <main id="guide-page" class="guide">

        <!-- Heading & Text -->
        <section class="text-guide">
            <header class="page-header">
                <h1 class="press-start-2p">
                    <span>High</span>
                    <span>&</span>
                    <span>Low</span>
                </h1>
            </header>

            <header class="page-header">
                <h1 class="dotgothic16">遊び方</h1>
            </header>

            <header class="page-header">
                <h1 class="press-start-2p">Win!!</h1>
            </header>

            <header class="page-header">
                <h1 class="press-start-2p">Lose!!</h1>
            </header>

            <header class="page-header">
                <h1 class="press-start-2p">
                    <span class="text-shadow">Game</span>
                    <span class="text-shadow">over</span>
                </h1>
            </header>

            <div class="text-wrapper">
                <h2 class="heading">ゲームの遊び方</h2>
                <p class="description">
                    自分のカードが親カードよりHigh (大きい)かLow(小さい)か予想してね。
                </p>
            </div>

            <div class="text-wrapper">
                <h2 class="heading">カードの順番</h2>
                <p class="description">
                   『2』が一番弱くて、『A』が一番強いよ。
                </p>
            </div>

            <div class="text-wrapper">
                <p class="description">
                    あなたが選択したのは <span>[High]</span> でした
                </p>
            </div>

            <div class="text-container">
                <h2 class="heading">今回の記録</h2>
                <p class="description">
                   記録： XX連勝!
                </p>
            </div>
        </section>

        <!-- Button Guide -->
        <section class="button-guide">
            <div class="button-container">
                <div class="button-wrapper">
                    <button class="btn btn--play">スタート</button>
                    <button class="btn btn--rule">遊び方</button>
                </div>

                <div class="button-wrapper">
                    <button class="btn btn--back">タイトルへ戻る</button>
                    <button class="btn btn--rule">遊び方</button>
                </div>

                <div class="button-wrapper">
                    <button class="btn btn--high">High</button>
                    <button class="btn btn--low">Low</button>
                </div>
                
                <div class="button-wrapper">
                    <button class="btn btn--result">結果画面へ</button>
                    <button class="btn btn--continue">続ける</button>
                </div>

                <div class="button-wrapper">
                    <button class="btn btn--back">タイトルへ戻る</button>
                    <button class="btn btn--retry">リトライ</button>
                </div>
            </div>
        </section>

        <!-- Card -->
        <section class="card-guid">
            <!-- Round Card -->
            <div class="round-card-container">
                <div class="card-grid">
                    <figure class="card">
                        <img src="./images/club/club1.png" alt="">
                        <figcaption>親カード</figcaption>
                    </figure>
                    <figure class="card">
                        <img src="./images/club/club2.png" alt="">
                        <figcaption>あなたのカード</figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
