<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utils.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/card.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages/round-page.css">
    <title>ラウンド結果 - High and Low</title>
</head>
<body class="bg-image">
    <div class="page">
        
        <!-- Header -->
        <header class="page-header">
            <h1 class="press-start-2p">Win!!</h1>
        </header>

        <!-- <header class="page-header">
            <h1 class="press-start-2p">Lose!!</h1>
        </header> -->
    
        <main id="round-page" class="round-page">
            <section class="round-section">

                <!-- Round Card -->
                <div class="round-card-container">
                    <div class="card-grid">
                        <figure class="card">
                            <img src="../images/club/club1.png" alt="">
                            <figcaption>親カード</figcaption>
                        </figure>
                        <figure class="card">
                            <img src="../images/club/club2.png" alt="">
                            <figcaption>あなたのカード</figcaption>
                        </figure>
                    </div>
                </div>

                <div class="text-wrapper">
                    <p class="description">
                        あなたが選択したのは <span>[High]</span> でした
                    </p>
                </div>

                <!-- Button -->
                <div class="button-wrapper">
                    <button class="btn btn--result" onclick="location.href='./result-page.html'">結果画面へ</button>
                    <button class="btn btn--continue" onclick="location.href='./game-page.html'">続ける</button>
                </div>
            </section>
        </main>
    </div>  
</body>
</html>
