<!DOCTYPE html>
<html kang="jp">
    <head>
        <meta charset="UTF-8" />
        <title>お問い合わせ - FOREST STUDIO</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body id="contact">
        <!-- Header -->
        <header>
            <h1>
                <a href="index.html">
                    <img src="../src/logo.png" alt="FOREST STUDIO">
                    FOREST STUDIO
                </a>
            </h1>

            <nav>
                <ul>
                    <li>
                        <a href="index.html">
                            トップ
                        </a>
                    </li>
                    <li>
                        <a href="news.html">
                            お知らせ
                        </a>
                    </li>
                    <li>
                        <a href="about.html">
                            工房について
                        </a>
                    </li>
                    <li>
                        <a href="contact.html">
                            お問い合わせ
                        </a>
                    </li>
                </ul>
            </nav>

        </header>

        <article>
            <h1>お問い合わせ</h1>

            <p>
                ご意見、ご感想などがありましたら、以下の欄にご記入の上、送信してください。また、森の工房やイベントに関するご質問などもお気軽にお寄せください。
            </p>

            <!-- from -->
            <!--
                テキストのリンクはサービス終了の為、以下で代用
                https://formsubmit.co/
                
                Read Article: https://qiita.com/free-honda/items/ad73d4be07808390ac88
            -->
            <form 
                action="https://formsubmit.co/takuya_kawamura@pc.evolveit.jp"
                method="post"
            >
                <!-- send id -->
                <input 
                    type="hidden"
                    name="_uid"
                    value="XXXXXXXXXXXXXXXX"
                >
                <!-- Redirect url (サーバーのトップページURLを値にする) -->
                <input 
                    type="hidden"
                    name="_next"
                    value="./thankyou.html"
                >
                <!-- Encode -->
                <input 
                    type="hidden"
                    name="_encode"
                    value="utf8"
                >
                <!-- Mail title -->
                <input 
                    type="hidden"
                    name="_subject"
                    value="お問い合わせ"
                >


                <!-- Name -->
                <p>
                    <label for="username">
                        名前:
                        <input 
                            type="text" 
                            name="username"
                        />
                    </label>
                </p>
    
                <!-- mail -->
                <p>
                    <label for="mail">
                        メールアドレス:
                        <input 
                            type="mail" 
                            name="usermail"
                        />
                    </label>
                </p>
    
                <!-- Textarea -->
                <p>
                    <label for="usercomment">
                        コメント:
                        <textarea name="usercomment"></textarea>
                    </label>
                </p>
    
                <!-- submit button -->
                <p>
                    <input 
                        type="submit"
                        value="送信"
                    >
                </p>

                <!-- Link -->
                <small>
                    Powered by 
                    <a href="https://formsubmit.co/" target="_blank">
                        formsubmit
                    </a>
                    <sub>&reg;</sub>
                </small>
            </form>
        </article>

        <!-- Footer -->
        <footer>
            <small>
                Copyright &copy; FOREST STUDIO, all rights reserved.
            </small>
        </footer>
    </body>
</html>
