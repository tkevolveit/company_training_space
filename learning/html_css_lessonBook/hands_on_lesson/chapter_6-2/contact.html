        <article>
            <h1>お問い合わせ</h1>

            <p>
                ご意見、ご感想などがありましたら、以下の欄にご記入の上、送信してください。また、森の工房やイベントに関するご質問などもお気軽にお寄せください。
            </p>

            <!-- from -->
            <!--
                テキストのリンクはサービス終了の為、以下で代用
                https://formsubmit.co/
                
                Read Article: https://qiita.com/free-honda/items/ad73d4be07808390ac88
            -->
            <form 
                action="https://formsubmit.co/takuya_kawamura@pc.evolveit.jp"
                method="post"
            >
                <!-- <input type="hidden" name="_captcha" value="false"> -->
                <input type="hidden" name="_next" value="thanks.html">
                <!-- Mail title -->
                <input 
                    type="hidden"
                    name="_subject"
                    value="お問い合わせ"
                >

                <label for="name">お名前：</label><br>
                <input type="text" id="name" name="name"><br><br>

                <label for="email">メールアドレス：</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="message">お問い合わせ内容：</label><br>
                <textarea id="message" name="message" rows="5"></textarea><br><br>

                <!--
                    form の挙動が確認できなかったので、代わりに onclick を使い
                    thankyou.html へ画面推移するようにしてます
                    https://qiita.com/SUGISHIA/items/d4d8b48be48767c17815
                -->
                <input 
                    type="submit"
                    onclick="location.href='./thanks.html'"
                />
            
                <!-- Link -->
                <small>
                    Powered by 
                    <a href="https://formsubmit.co/" target="_blank">
                        formsubmit
                    </a>
                    <sub>&reg;</sub>
                </small>
            </form>
